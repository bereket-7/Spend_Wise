[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-wise"
version = "1.0.0"
description = "AI-powered expense tracking and financial wellness platform"
authors = [
    {name = "Spend Wise Team", email = "team@spendwise.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/spendwise/spend-wise"
Documentation = "https://docs.spendwise.com"
Repository = "https://github.com/spendwise/spend-wise.git"
"Bug Tracker" = "https://github.com/spendwise/spend-wise/issues"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=controller",
    "--cov=database",
    "--cov=utils",
    "--cov=config",
    "--cov-config=.coveragerc",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
